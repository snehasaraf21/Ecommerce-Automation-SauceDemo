name: Run Selenium Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  normal-tests:
    name: Core flow tests (must pass)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Updated to v4

      - name: Set up Python
        uses: actions/setup-python@v5 # Updated to v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chrome
        uses: browser-actions/setup-chrome@latest

      - name: Run core tests
        # Instead of listing files, we point to the folder. 
        # Pytest will find login, inventory, and checkout automatically.
        run: pytest src/tests/ -v --alluredir=allure-results

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results/

  ai-fuzz-tests:
    name: AI fuzz tests (expected to fail)
    runs-on: ubuntu-latest
    continue-on-error: true # Job-level protection
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chrome
        uses: browser-actions/setup-chrome@latest

      - name: Run AI fuzz tests
        run: pytest src/tests/test_fuzzing.py -v
      - name: Run AI fuzz tests
        run: pytest src/tests/test_fuzzing.py -v
        continue-on-error: true
