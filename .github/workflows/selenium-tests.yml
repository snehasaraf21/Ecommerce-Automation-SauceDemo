name: Run Selenium Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

# This clears the Node 20 warning by forcing Node 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  normal-tests:
    name: Core flow tests (must pass)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Updated to v4

      - name: Set up Python
        uses: actions/setup-python@v5 # Updated to v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirement.txt

      - name: Install Chrome
        uses: browser-actions/setup-chrome@latest

      - name: Run core tests
        run: |
          # Check if the folder exists (for debugging)
          ls -R src/
          # Run pytest with the python -m prefix
          mkdir -p allure-results
          # We provide the EXACT path to the tests folder
          # We use --dist=loadscope (if using xdist) or just -v
          python -m pytest src/tests/ -v -m "not fuzz" --alluredir=allure-results
      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results/

  ai-fuzz-tests:
    name: AI fuzz tests (expected to fail)
    runs-on: ubuntu-latest
    continue-on-error: true # Job-level protection
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirement.txt

      - name: Install Chrome
        uses: browser-actions/setup-chrome@latest

      - name: Run AI fuzz tests
        run: python -m pytest src/tests/ -m "fuzz" -v
        continue-on-error: true
